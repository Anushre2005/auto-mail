name: Email autopilot

# Every 30 minutes on weekdays, at the times when it's morning for someone on the list.
# The engine only emails people whose own clock says 8-10 AM (India: 8-11 AM), so extra runs are harmless.
on:
  schedule:
    - cron: "0,30 2-5 * * 1-5"    # India mornings   (8:00-11:00 AM IST)
    - cron: "0,30 7-9 * * 1-5"    # Europe mornings
    - cron: "0,30 12-18 * * 1-5"  # US mornings, East to West coast
  workflow_dispatch:
    inputs:
      mode:
        description: "check = log in and look for replies, send nothing; send = send what's due"
        type: choice
        options: [check, send]
        default: check

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send what's due
        run: python followup_engine.py run ${{ inputs.mode == 'check' && '--dry-run' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
      - name: Save the queue
        if: always()
        run: |
          git config user.name "email-autopilot"
          git config user.email "email-autopilot@users.noreply.github.com"
          python cloud_sync.py
